robot_model: f1tenth
base_frame: base_link
z_offset: 0.0
mass:
  base_kg: 3.74
sensors:
  - name: lidar
    type: laserscan
    topic: ${namespace}/scan
    frame: laser_link
    sensor: laser
  - name: lidar_points
    type: pointcloud
    topic: ${namespace}/scan/points
    frame: laser_link
    sensor: laser
control:
  mode: ros2_control
  config: package://arena_robots/robots/f1tenth/control.yaml
  controllers:
    - joint_state_broadcaster
    - f1tenth_steering_controller
  cmd_vel_topic: f1tenth_steering_controller/reference
  odom_topic: f1tenth_steering_controller/odometry
