odom_frame: odom
sensor_frame: laser_link
radius: 0.48  # circumradius of the footprint about base_link
is_holonomic: false
min_turning_radius: 0.7416  # wheelbase / tan(s_max) = 0.3302 / tan(0.4189), f1tenth_gym

# 0.58 x 0.31 m body (f1tenth_gym), centred on the wheelbase, base_link on the rear axle
footprint: &footprint [[0.455, 0.155], [0.455, -0.155], [-0.125, -0.155], [-0.125, 0.155]]

polygons_dict:
  StopPolygon:
    type: polygon
    points: *footprint
    action_type: stop
    min_points: 4
    visualize: true
    polygon_pub_topic: polygon_stop
    enabled: true

velocity_limits:
  linear: [-1.0, 2.0]
  angular: [-2.5, 2.5]

planar:
  velocity: {linear: [-1.0, 3.0], lateral: [0.0, 0.0], angular: [-4.0, 4.0]}
  acceleration: {linear: 9.51, lateral: .inf, angular: .inf}
  gain: {linear: 1.0, lateral: 1.0, angular: 1.0}
  lag: 0.0
  traction: 9.81
  pivot: 0.0
  timeout: 0.5

actions:
  continuous:
    linear:
      min: -1.0
      max: 2.0
    angular:
      min: -2.5
      max: 2.5
  discrete:
    - {name: move_forward, linear: 1.0, angular: 0.0}
    - {name: move_backward, linear: -0.5, angular: 0.0}
    - {name: turn_left, linear: 1.0, angular: 1.0}
    - {name: turn_right, linear: 1.0, angular: -1.0}
    - {name: stop, linear: 0.0, angular: 0.0}

laser:
  angle:
    increment: 0.004359297
    max: 2.3562
    min: -2.3562
  num_beams: 1081
  range: 20.0
  update_rate: 40

nav2: {local_planner: mppi, global_planner: smac_hybrid}
